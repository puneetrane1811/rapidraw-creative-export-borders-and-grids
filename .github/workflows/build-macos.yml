name: Build macOS Release (.dmg)

on:
  workflow_dispatch:
    inputs:
      rapidraw_version:
        description: 'RapidRAW Release Tag or Branch (Use "main" for current codebase)'
        required: true
        default: 'main'
      upload_to_release:
        description: 'Attach to an existing GitHub Release?'
        type: boolean
        required: false
        default: true
      release_tag:
        description: 'GitHub Release Tag to attach to (if above is true)'
        required: false
        default: 'v1.6.3-borders'

jobs:
  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Clone RapidRAW source
        shell: bash
        run: |
          echo "Cloning RapidRAW ${{ github.event.inputs.rapidraw_version }}..."
          git clone --depth 1 --branch ${{ github.event.inputs.rapidraw_version }} https://github.com/CyberTimon/RapidRAW.git rapidraw-src

      - name: Apply Export Borders Patch
        shell: bash
        run: |
          echo "Applying patch..."
          cd rapidraw-src
          git apply --ignore-whitespace --ignore-space-change ../export-borders.patch
          echo "Patch applied successfully!"
          git status

      - name: Install Frontend Dependencies
        shell: bash
        run: |
          cd rapidraw-src
          npm ci || npm install

      - name: Build macOS Installer with Tauri (.dmg)
        shell: bash
        run: |
          cd rapidraw-src
          npm run tauri -- build --bundles dmg --no-sign

      - name: Locate Built Installer
        id: locate-installer
        shell: bash
        run: |
          DMG_PATH=$(find rapidraw-src/src-tauri/target/release/bundle/dmg -name "*.dmg" | head -n 1)
          if [ -z "$DMG_PATH" ]; then
            echo "::error::Installer .dmg not found!"
            exit 1
          fi
          echo "Found installer at $DMG_PATH"
          echo "dmg_path=$DMG_PATH" >> $GITHUB_OUTPUT
          echo "dmg_name=$(basename "$DMG_PATH")" >> $GITHUB_OUTPUT

      - name: Upload Installer as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate-installer.outputs.dmg_name }}
          path: ${{ steps.locate-installer.outputs.dmg_path }}
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: ${{ github.event.inputs.upload_to_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: ${{ steps.locate-installer.outputs.dmg_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
